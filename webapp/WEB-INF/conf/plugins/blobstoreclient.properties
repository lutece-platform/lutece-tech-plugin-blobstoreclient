################################################################################
# Configuration file for BlobStore Client plugin

# REST urls for sending data to blobstore webapp
blobstoreclient.blobstore.rest.create.url=/rest/blobstore/create
blobstoreclient.blobstore.rest.delete.url=/rest/blobstore/delete
blobstoreclient.blobstore.rest.file.url=/rest/blobstore/

# The client service the site uses. Both implementations are CDI alternatives; library-priority-extension enables
# the one whose key holds a strictly positive value, and the highest wins. Zero disables an alternative.
# The local service reads the blobs through the blobstore plugin deployed in the same webapp; the web service one
# calls a remote blobstore over REST and needs a blobstoreclient.requestAuthenticator bean of its own.
blobstoreclient.service.priority.locale=10
blobstoreclient.service.priority.webservice=0
